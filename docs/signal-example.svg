<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Bullish Shark signal geometry</title>
  <desc id="desc">A bullish OXABC Shark with its completion zone, confirmed entry, target, and stop.</desc>
  <rect width="960" height="520" fill="#ffffff" />
  <text x="480" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111827">Bullish Shark signal</text>

  <rect x="70" y="359" width="670" height="52" fill="#dbeafe" opacity="0.7" />
  <text x="755" y="390" font-family="system-ui, sans-serif" font-size="15" fill="#1d4ed8">XC / OX zone</text>

  <polyline points="90,380 250,100 390,260 550,75 710,385" fill="none" stroke="#0f6fb5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="90,380 250,100 710,385 90,380" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" />
  <line x1="250" y1="100" x2="550" y2="75" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" />
  <line x1="390" y1="260" x2="710" y2="385" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" />

  <g fill="#0f6fb5">
    <circle cx="90" cy="380" r="6" />
    <circle cx="250" cy="100" r="6" />
    <circle cx="390" cy="260" r="6" />
    <circle cx="550" cy="75" r="6" />
    <circle cx="710" cy="385" r="6" />
  </g>

  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">
    <text x="65" y="410">O</text>
    <text x="235" y="88">X</text>
    <text x="370" y="290">A</text>
    <text x="543" y="63">B</text>
    <text x="715" y="415">C</text>
  </g>

  <line x1="710" y1="245" x2="900" y2="245" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 7" />
  <text x="945" y="250" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" fill="#15803d">50% BC target</text>

  <line x1="710" y1="430" x2="900" y2="430" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 7" />
  <text x="945" y="435" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" fill="#b91c1c">stop</text>

  <circle cx="770" cy="340" r="7" fill="#22c55e" />
  <path d="M 710 385 C 730 365, 750 350, 770 340" fill="none" stroke="#22c55e" stroke-width="4" />
  <text x="785" y="345" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">confirmed entry</text>

  <g font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#334155">
    <text x="400" y="105" text-anchor="middle">AB / XA = 1.13–1.618</text>
    <text x="570" y="260">BC / AB = 1.618–2.24</text>
    <text x="370" y="455" text-anchor="middle">XC / OX = 0.886–1.13</text>
  </g>
</svg>
